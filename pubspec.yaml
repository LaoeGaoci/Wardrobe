name: wardrobe
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  camera: ^0.12.0+2
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.1.1
  image_picker: ^1.2.3
  http: ^1.6.0

  # 网络图片磁盘缓存。
  # 4.0.0 需要 Dart 3.12；当前项目 SDK 是 ^3.10.4，
  # 因此使用兼容的 3.4.1。
  cached_network_image: ^3.4.1

  # 图片加载占位、错误状态与淡入动画。
  octo_image: ^2.1.0

  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true

  image_path: "assets/icon/app_icon.png"

  adaptive_icon_background: "#AFCFB8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
